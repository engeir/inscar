# See https://pre-commit.com/ for usage and config
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: ruff_fmt
        name: Ruff format
        stages: [commit]
        language: system
        entry: ruff format
        types: [python]
      - id: ruff_lint
        name: Ruff lint
        stages: [commit]
        language: system
        entry: ruff check --fix
        types: [python]
      - id: mypy
        name: mypy
        stages: [commit]
        language: system
        entry: mypy
        types: [python]
        require_serial: true
      - id: pydocstringformatter
        name: pydocstringformatter
        stages: [commit]
        language: system
        entry: pydocstringformatter
        types: [python]
      - id: pytest
        name: pytest
        stages: [commit]
        language: system
        entry: pytest tests
        types: [python]
        pass_filenames: false
