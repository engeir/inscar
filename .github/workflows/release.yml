name: Release
on:
  push:
    branches:
      - main
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Upgrade pip
        run: |
          pip install pip
          pip --version
      - name: Install Uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          source "$HOME/.local/bin/env"
          uv --version
      - name: Check if there is a parent commit
        id: check-parent-commit
        run: |
          echo "::set-output name=sha::$(git rev-parse --verify --quiet HEAD^)"
      - name: Detect and tag new version
        id: check-version
        if: steps.check-parent-commit.outputs.sha
        uses: salsify/action-detect-and-tag-new-version@b1778166f13188a9d478e2d1198f993011ba9864 # v2.0.3
        with:
          version-command: |
            bash -o pipefail -c "$HOME/.local/bin/uv version"
      - name: Bump version for developmental release
        if: "! steps.check-version.outputs.tag"
        run: |
          source "$HOME/.local/bin/env"
          uv version --bump patch &&
          version=$(uv version) &&
          uv version $version.dev.$(date +%s)
      - name: Build package
        run: |
          source "$HOME/.local/bin/env"
          uv build
      - name: Publish package on PyPI
        if: steps.check-version.outputs.tag
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }}
      # - name: Publish package on TestPyPI
      #   if: "! steps.check-version.outputs.tag"
      #   uses: pypa/gh-action-pypi-publish@v1.9.0
      #   with:
      #     user: __token__
      #     password: ${{ secrets.TEST_PYPI_TOKEN }}
      #     repository_url: https://test.pypi.org/legacy/
      - name: Publish the release notes
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          publish: ${{ steps.check-version.outputs.tag != '' }}
          tag: ${{ steps.check-version.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
