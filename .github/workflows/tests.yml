name: Tests
on:
  - push
  - pull_request
jobs:
  tests:
    name: ${{ matrix.session }} ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python-version: "3.11", os: ubuntu-latest, session: "mypy"}
          - {python-version: "3.11", os: ubuntu-latest, session: "tests"}
          - {python-version: "3.12", os: ubuntu-latest, session: "mypy"}
          - {python-version: "3.12", os: ubuntu-latest, session: "tests"}
          - {python-version: "3.13", os: ubuntu-latest, session: "mypy"}
          - {python-version: "3.13", os: ubuntu-latest, session: "tests"}
          - {python-version: "3.14", os: ubuntu-latest, session: "mypy"}
          - {python-version: "3.14", os: ubuntu-latest, session: "tests"}
          - {python-version: "3.15", os: ubuntu-latest, session: "mypy"}
          - {python-version: "3.15", os: ubuntu-latest, session: "tests"}
          - {python-version: "3.15", os: macos-latest, session: "tests"}
          # - { python-version: "3.15", os: windows-latest, session: "tests" }
          - {python-version: "3.12", os: ubuntu-latest, session: "docs-build"}
          - {python-version: "3.15", os: ubuntu-latest, session: "pre-commit"}
          - {python-version: "3.15", os: ubuntu-latest, session: "typeguard"}
          - {python-version: "3.15", os: ubuntu-latest, session: "xdoctest"}
    env:
      NOXSESSION: ${{ matrix.session }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint with Ruff
        uses: chartboost/ruff-action@e18ae971ccee1b2d7bbef113930f00c670b78da4 # v1.0.0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip
        run: |
          pip install pip
          pip --version
      - name: Install Uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv --version
      - name: Install Nox
        run: |
          pipx install nox
          nox --version
      - name: Compute pre-commit cache key
        if: matrix.session == 'pre-commit'
        id: pre-commit-cache
        shell: python
        run: |
          import hashlib
          import sys
          python = "py{}.{}".format(*sys.version_info[:2])
          payload = sys.version.encode() + sys.executable.encode()
          digest = hashlib.sha256(payload).hexdigest()
          result = "${{ runner.os }}-{}-{}-pre-commit".format(python, digest[:8])
          print("::set-output name=result::{}".format(result))
      - name: Restore pre-commit cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.session == 'pre-commit'
        with:
          path: ~/.cache/pre-commit
          key: ${{ steps.pre-commit-cache.outputs.result }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ steps.pre-commit-cache.outputs.result }}-
      - name: Run Nox
        run: |
          nox --force-color --python=${{ matrix.python-version }}
      - name: Upload coverage data
        if: always() && matrix.session == 'tests'
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
        with:
          name: coverage-data-${{ matrix.python-version }}-${{ matrix.os }}
          path: ".coverage.*"
      - name: Upload documentation
        if: matrix.session == 'docs-build'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs
          path: docs/_build
  coverage:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.15
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Upgrade pip
        run: |
          pip install pip
          pip --version
      - name: Install Uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv --version
      - name: Install Nox
        run: |
          pip install nox
          nox --version
      - name: Run codecov session
        run: nox --sessions tests-3.15 coverage
        env:
          CODECOV_TOKEN: ${{secrets.CODECOV_TOKEN}}
